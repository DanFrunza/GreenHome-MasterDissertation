version: "3.9"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    ports:
      - "8123:8123"
    volumes:
      - ./HA/config:/config
    restart: unless-stopped
    depends_on:
      - mqtt-local

  mqtt-local:
    image: eclipse-mosquitto:2
    container_name: mqtt-local
    ports:
      - "1883:1883"
    restart: unless-stopped

  co2-simulation:
    build: ./co2-simulation
    container_name: co2-simulator
    depends_on:
      - mqtt-local
    restart: unless-stopped