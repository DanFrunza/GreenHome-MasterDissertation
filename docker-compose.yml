version: "3.9"

services:
#Home Assistant
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    ports:
      - "8123:8123"
    volumes:
      - ./HA/config:/config
    restart: unless-stopped
    depends_on:
      - mqtt-local

#MQTT Broker - Local
  mqtt-local:
    image: eclipse-mosquitto:2
    container_name: mqtt-local
    ports:
      - "1883:1883"
    environment:
      - HOME_ID=${HOME_ID}
    volumes:
      - ./mqtt-local/mosquitto-local.conf.template:/mosquitto/config/mosquitto.conf.template:ro
      - ./mqtt-local/data:/mosquitto/data
    entrypoint: >
      sh -c "sed 's|HOME_ID|$HOME_ID|g' /mosquitto/config/mosquitto.conf.template > /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"
    restart: unless-stopped
    depends_on:
      - mqtt-cloud

#MQTT Broker - Cloud
  mqtt-cloud:
    image: eclipse-mosquitto:2
    container_name: mqtt-cloud
    ports:
      - "1884:1883"
    volumes:
      - ./mqtt-cloud/mosquitto-cloud.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

#Sensor Simulations
  co2-simulation:
    build: ./simulations/co2-simulation
    container_name: co2-simulator
    depends_on:
      - mqtt-local
    restart: unless-stopped

  umidification-simulation:
    build: ./simulations/umidification-simulation
    container_name: umidification-simulator
    depends_on:
      - mqtt-local
    restart: unless-stopped

  purifier-simulation:
    build: ./simulations/purifier-simulation
    container_name: purifier-simulator
    depends_on:
      - mqtt-local
    restart: unless-stopped

#Backend Services

  mqtt-service:
    build: ./mqtt-service
    container_name: mqtt-service
    environment:
      - MQTT_CLOUD_HOST=${MQTT_CLOUD_HOST}
      - MQTT_CLOUD_PORT=${MQTT_CLOUD_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - mqtt-cloud
    restart: unless-stopped

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    depends_on:
      - postgres-db
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped

  api-service:
    build: ./api-service
    container_name: api-service
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MQTT_HOST=${MQTT_CLOUD_HOST}
      - MQTT_PORT=${MQTT_CLOUD_PORT}
    ports:
      - "3001:3001"
    depends_on:
      - analytics-service
    restart: unless-stopped

#Local Agent
  local-agent:
    build: ./local-agent
    container_name: local-agent
    environment:
      - MQTT_LOCAL_HOST=${MQTT_LOCAL_HOST}
      - MQTT_LOCAL_PORT=${MQTT_LOCAL_PORT}
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
    depends_on:
      - mqtt-local
      - homeassistant
    restart: unless-stopped

#Frontend

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    restart: unless-stopped

#Database and Storage

  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      - MQTT_CLOUD_HOST=${MQTT_CLOUD_HOST}
      - MQTT_CLOUD_PORT=${MQTT_CLOUD_PORT}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "55432:5432"
    volumes:
      - ./database/postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio/minio-data:/data
    restart: unless-stopped